name: Semgrep OSS (SARIF export)

on:
  workflow_dispatch:
    inputs:
      upload_sarif:
        description: 'Set to "true" to upload SARIF artifact to GitHub'
        required: false
        default: 'true'
      import_sarif:
        description: 'Set to "true" to import SARIF results to GitHub Code Scanning'
        required: false
        default: 'false'

permissions:
  contents: read
  security-events: write   # required to upload SARIF to Code Scanning
  actions: read

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run the "semgrep scan" command on the command line of the docker image.
      - run: |
            docker run --rm -v "$PWD":/src -w /src semgrep/semgrep:latest semgrep --config p/security-audit --sarif -o semgrep.sarif
            
      - name: Import SARIF results to GitHub Code Scanning
        if: ${{ github.event.inputs.import_sarif == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: "semgrep"

      - name: Prepare SARIF export bundle
        run: |
          set -euo pipefail
          ts="$(date -u +'%Y%m%dT%H%M%SZ')"
          mkdir -p export
          cp semgrep.sarif "export/semgrep_${ts}.sarif"

      - name: Upload SARIF artifact
        if: ${{ github.event.inputs.upload_sarif == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sarif-semgrep-${{ github.run_id }}
          path: export/*.sarif
          retention-days: 30
          if-no-files-found: error